<text x="280.0" y="263" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Generate a spec and task plan</text>
<text x="280.0" y="285" text-anchor="middle" font-size="14" fill="#475569">using Jira as the requirements source</text>
<line x1="280.0" y1="302" x2="280.0" y2="337" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
