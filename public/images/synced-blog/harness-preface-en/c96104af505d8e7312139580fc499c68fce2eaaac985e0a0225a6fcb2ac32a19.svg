<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 536" width="560" height="536" role="img" aria-labelledby="t">
<title id="t">Workflow: Jira ticket opened, generate AC and rough design, settled in the meeting, generate spec and task plan, implementation, self-testing done and hand-off to QA</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="0.5" y="0.5" width="559" height="535" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<g font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif">
<rect x="40" y="28" width="480" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="280.0" y="66" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Jira ticket opened</text>
<line x1="280.0" y1="94" x2="280.0" y2="129" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
