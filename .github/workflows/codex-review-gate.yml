name: Update Codex Review Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to reevaluate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

# Serialize evaluations for a PR; always read fresh APIs, not stale event bodies.
concurrency:
  group: codex-review-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  update:
    name: Update review status
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.id == 199175422)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never execute the PR checkout with this write-capable token.
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/codex-review-gate.mjs`);
            await run({ github, context, core });
